name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      LUNA_PRIVACY_TERMS_JSON: ${{ secrets.LUNA_PRIVACY_TERMS_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: container/agent-runner
      - name: Check public files and all reachable history
        run: pnpm check:repository && pnpm check:history
      - run: brew install gitleaks
      - run: gitleaks git --redact --log-opts=--all .
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:container
      - name: Smoke installed npm package without local config or live services
        run: pnpm smoke:package

  generated-release-status:
    # GitHub runs a dispatched workflow against the release PR's commit but does not include that
    # check run in the PR rollup. A commit status makes the same result visible on the PR.
    if: always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'changeset-release/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report generated release status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ needs.build.result }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='CI / generated release' \
            -f description="Generated release validation: $state" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
