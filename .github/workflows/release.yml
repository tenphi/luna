name: Release

# The same release-PR loop as Akno: a change to published behavior carries a small changeset file;
# pushes to main update one version PR; merging that PR publishes the verified tarball, tags it, and
# creates the GitHub release. A manual run is always a rehearsal and can never publish.
on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'bin/**'
      - 'config/**'
      - 'container/**'
      - 'scripts/**'
      - 'setup/**'
      - 'src/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS because the suite and the package smoke exercise the native helpers and launchd paths.
    runs-on: macos-latest
    env:
      LUNA_PRIVACY_TERMS_JSON: ${{ secrets.LUNA_PRIVACY_TERMS_JSON }}
    permissions:
      actions: write # dispatch CI for the generated release PR
      contents: write # version commits, tags, and GitHub releases
      pull-requests: write # the rolling Changesets release PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # npm trusted publishing requires npm 11.5.1 or newer. Pin the release client so the runner
      # image cannot silently move this authentication boundary in either direction.
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: container/agent-runner

      # Publishing repeats the whole CI gate. The merge commit is the source of the package bytes.
      - name: Check public files and all reachable history
        run: pnpm check:repository && pnpm check:history
      - run: brew install gitleaks
      - run: gitleaks git --redact --log-opts=--all .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:container
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm docs:doctor && pnpm docs:build && pnpm docs:check-build

      # The tarball is packed once, outside the checkout, smoke-tested, and published as is. A
      # published version number is spent, so what it contains is checked before it can ship.
      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/luna-release"
          mkdir -p "$out"
          npm pack --pack-destination "$out"
          echo "tarball=$(ls "$out"/*.tgz)" >> "$GITHUB_OUTPUT"
      - name: Smoke the release tarball without local config or live services
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/smoke-package.mjs "$TARBALL"
      - uses: actions/upload-artifact@v7
        with:
          name: luna-npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      # The Changesets action commits what changed in the checkout to the release PR. Build output,
      # docs, and dependencies are ignored; anything else here would ride along unreviewed.
      - name: Checkout is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo '::error::The gates left changes in the checkout'
            exit 1
          fi

      # With pending changesets this opens or updates the release PR. Without them, it runs
      # `pnpm release`, which publishes a version that is not on npm yet and tags it.
      - name: Open release PR or publish
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v2.1.1
        with:
          publish-script: pnpm release
          version-script: pnpm version:packages
          commit-message: 'chore: version package'
          pr-title: 'chore: release package'
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUNA_RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}

      - name: Name the GitHub release and attach the tarball
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          gh release edit "v$version" --title "Luna $version"
          gh release upload "v$version" "$TARBALL"

      # A PR created with GITHUB_TOKEN does not emit another pull_request event. Dispatching CI
      # explicitly keeps the generated version diff checked without requiring a personal token.
      - name: Validate generated release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"

      - name: Rehearsal complete
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Release gates passed; manual runs do not version, tag, or publish.'
