name: Documentation

on:
  push:
    branches: [main]
    paths:
      [
        'README.md',
        'docs/**',
        'public/**',
        'astro.config.ts',
        'docs.config.ts',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        '.nvmrc',
        '.github/workflows/docs.yml',
      ]
  pull_request:
    paths:
      [
        'README.md',
        'docs/**',
        'public/**',
        'astro.config.ts',
        'docs.config.ts',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        '.nvmrc',
        '.github/workflows/docs.yml',
      ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      LUNA_PRIVACY_TERMS_JSON: ${{ secrets.LUNA_PRIVACY_TERMS_JSON }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository
      - run: pnpm docs:doctor
      - run: pnpm docs:build
      - run: pnpm docs:check-build
      - run: node scripts/check-repository-safety.mjs --root site-dist
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
